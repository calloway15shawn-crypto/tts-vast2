# Скопируйте этот файл в config.yaml и заполните. config.yaml НЕ загружайте на GitHub.

# API-ключ Vast: cloud.vast.ai → Keys → +New
vast_api_key: ""

# Репозиторий GitHub, куда загружен этот проект (ЛОГИН/НАЗВАНИЕ)
github_repo: "ВАШ_ЛОГИН/tts-vast"
github_branch: "main"
# Токен только на чтение этого репозитория. Оставьте пустым, если репозиторий публичный.
github_token: ""

# Имя образца голоса: файл voices/narrator.wav (или .mp3)
voice: "narrator"

# Какие видеокарты арендовать
gpu:
  names: ["RTX 4090", "RTX 5090"]   # можно добавить "RTX 3090" — дешевле, но медленнее
  max_price_per_hour: 0.6           # не дороже, $ в час
  min_reliability: 0.95             # надёжность хоста
  interruptible: false              # true — в 2–3 раза дешевле, но машину могут отключить
  disk_gb: 60

# Проверка качества
check:
  max_wer: 0.12        # допустимое расхождение распознанного текста с исходным (12%)
  max_attempts: 3      # попыток перегенерации одного фрагмента
  clone_mode: "xvec"   # xvec — только тембр голоса; icl — тембр и манера (нужен voices/narrator.txt с расшифровкой)

output_format: "mp3"   # или wav

# Замена движка для языка (по умолчанию польский — voxcpm, остальные — qwen)
engines: {}
#  ru: voxcpm

# Локальный API (6_api.bat): текст приходит запросом, машина арендуется сама
api:
  host: "127.0.0.1"      # 0.0.0.0 — открыть для других компьютеров, тогда обязателен token
  port: 8800
  token: ""              # пусто — принимаются запросы только с этого компьютера
  idle_minutes: 10       # сколько держать машину без работы, прежде чем удалить
  max_session_hours: 6   # предохранитель: сессия дольше — машина удаляется
  max_tries: 3           # сколько раз пробовать задачу на новых машинах
